name: Publish web page

# Builds the FluxScale page into _site and serves it with GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions.
#
# The page runs the fluxscale of this checkout, built as a wheel by
# scripts/build_site.py, so a change to the package reaches the page with the push.

on:
  push:
    branches: [main]
    paths:
      - "fluxscale/**"
      - "scripts/build_site.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
